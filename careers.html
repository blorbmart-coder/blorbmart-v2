<html lang="en-NG">
  <head>

    <meta name="author" content="Blorbmart Limited" />
    <meta name="theme-color" content="#0A0F12" />
    <link rel="canonical" href="https://www.blorbmart.com.ng/careers" />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://www.blorbmart.com.ng/careers" />
    <meta property="og:title" content="Careers at Blorbmart" />

      property="og:description"
      content="We are building the campus super-app, campus by campus. See our open roles — or send your CV and we will come back to you when one fits."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <!--
      The page itself. Each open role also renders its own JobPosting on the
      client, which is where Google for Jobs reads it from.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://www.blorbmart.com.ng/careers#webpage",
            "url": "https://www.blorbmart.com.ng/careers",
            "name": "Careers at Blorbmart",
            "description": "Open roles at Blorbmart, the campus super-app for food, bills and event tickets in Nigeria.",
            "inLanguage": "en-NG",
            "isPartOf": { "@id": "https://www.blorbmart.com.ng/#website" },
            "publisher": { "@id": "https://www.blorbmart.com.ng/#organization" },
            "breadcrumb": { "@id": "https://www.blorbmart.com.ng/careers#breadcrumb" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://www.blorbmart.com.ng/careers#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Blorbmart", "item": "https://www.blorbmart.com.ng/" },
              { "@type": "ListItem", "position": 2, "name": "Careers", "item": "https://www.blorbmart.com.ng/careers" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root" data-page="careers"></div>
    <script type="module" src="/src/careers/main.tsx"></script>
  </body>
</html>
